<svg width="100%" height="100%" viewBox="0 0 1000 1400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Balón de fútbol sobre el pasto">
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f3d24"/>
      <stop offset="45%" stop-color="#155c33"/>
      <stop offset="100%" stop-color="#0a2c1a"/>
    </linearGradient>
    <radialGradient id="bglow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="rgba(120,255,170,0.25)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e7ebe6"/>
      <stop offset="100%" stop-color="#b9c2ba"/>
    </radialGradient>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1400" fill="url(#grass)"/>
  <rect width="1000" height="1400" fill="url(#bglow)"/>

  <!-- mown stripes -->
  <g opacity="0.35">
    <rect x="0" y="0" width="1000" height="120" fill="#0d3320"/>
    <rect x="0" y="240" width="1000" height="120" fill="#0d3320"/>
    <rect x="0" y="480" width="1000" height="120" fill="#0d3320"/>
    <rect x="0" y="720" width="1000" height="120" fill="#0d3320"/>
    <rect x="0" y="960" width="1000" height="120" fill="#0d3320"/>
    <rect x="0" y="1200" width="1000" height="120" fill="#0d3320"/>
  </g>

  <!-- grass blades foreground -->
  <g stroke="#1d7a44" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <path d="M60 1400 q10 -60 30 -90"/>
    <path d="M180 1400 q-6 -70 8 -110"/>
    <path d="M760 1400 q12 -64 34 -96"/>
    <path d="M900 1400 q-8 -72 6 -112"/>
    <path d="M420 1400 q4 -54 22 -84"/>
    <path d="M620 1400 q-4 -58 14 -92"/>
  </g>

  <!-- ball -->
  <g>
    <ellipse cx="500" cy="1080" rx="250" ry="52" fill="rgba(0,0,0,0.35)"/>
    <circle cx="500" cy="720" r="290" fill="url(#ball)"/>
    <g fill="#14201a">
      <polygon points="500,600 560,640 538,712 462,712 440,640"/>
      <polygon points="500,470 560,505 545,560 455,560 440,505" opacity="0.9"/>
      <polygon points="352,560 410,520 452,566 432,626 372,620"/>
      <polygon points="648,560 590,520 548,566 568,626 628,620"/>
      <polygon points="392,760 452,712 500,760 476,820 412,820"/>
      <polygon points="608,760 548,712 500,760 524,820 588,820"/>
    </g>
    <path d="M500 430 a290 290 0 0 1 250 140" stroke="rgba(255,255,255,0.6)" stroke-width="14" fill="none" stroke-linecap="round"/>
  </g>

  <rect width="1000" height="1400" fill="url(#vig)"/>
</svg>
