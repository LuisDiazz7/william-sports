<svg width="100%" height="100%" viewBox="0 0 1400 1050" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pizarra táctica durante una capacitación de fútbol">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07130d"/>
      <stop offset="100%" stop-color="#0b2317"/>
    </linearGradient>
    <radialGradient id="luz" cx="40%" cy="15%" r="65%">
      <stop offset="0%" stop-color="rgba(150,255,190,0.20)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16351f"/>
      <stop offset="100%" stop-color="#0f2517"/>
    </linearGradient>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="1050" fill="url(#bg)"/>
  <rect width="1400" height="1050" fill="url(#luz)"/>

  <!-- easel -->
  <g stroke="#0a1a11" stroke-width="18">
    <line x1="700" y1="720" x2="560" y2="1010"/>
    <line x1="700" y1="720" x2="840" y2="1010"/>
    <line x1="700" y1="720" x2="700" y2="1010"/>
  </g>

  <!-- board -->
  <rect x="200" y="150" width="1000" height="600" rx="14" fill="url(#board)" stroke="#1f4a30" stroke-width="6"/>
  <g stroke="rgba(235,255,244,0.55)" stroke-width="5" fill="none">
    <rect x="250" y="200" width="900" height="500" rx="6"/>
    <line x1="700" y1="200" x2="700" y2="700"/>
    <circle cx="700" cy="450" r="110"/>
    <rect x="250" y="380" width="120" height="140"/>
    <rect x="1030" y="380" width="120" height="140"/>
  </g>

  <!-- tactics: X, O and arrows -->
  <g stroke="#5be08f" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M420 300 l50 50 M470 300 l-50 50"/>
    <path d="M900 560 l50 50 M950 560 l-50 50"/>
  </g>
  <g fill="none" stroke="#f2f4ef" stroke-width="7">
    <circle cx="600" cy="330" r="26"/>
    <circle cx="820" cy="360" r="26"/>
  </g>
  <g stroke="#ff9a4d" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M620 340 q120 60 190 20"/>
    <path d="M810 350 l-14 -16 M810 350 l-24 6"/>
    <path d="M470 500 q140 120 300 60"/>
    <path d="M770 560 l-16 -14 M770 560 l-24 8"/>
  </g>

  <!-- attendees silhouettes -->
  <g fill="#04110a">
    <circle cx="180" cy="900" r="40"/><path d="M112 1050 q8 -120 68 -140 q60 20 68 140 Z"/>
    <circle cx="1220" cy="900" r="40"/><path d="M1152 1050 q8 -120 68 -140 q60 20 68 140 Z"/>
  </g>

  <rect width="1400" height="1050" fill="url(#vig)"/>
</svg>
