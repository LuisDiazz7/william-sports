<svg width="100%" height="100%" viewBox="0 0 1400 1050" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ojeador observando un partido desde el costado de la cancha">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040b13"/>
      <stop offset="100%" stop-color="#0b1a2b"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#133f6b"/>
      <stop offset="100%" stop-color="#0a1c30"/>
    </linearGradient>
    <radialGradient id="spot" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="rgba(150,255,190,0.22)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.62)"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="1050" fill="url(#sky)"/>
  <rect width="1400" height="1050" fill="url(#spot)"/>

  <!-- pitch receding -->
  <path d="M0 1050 L0 560 L1400 470 L1400 1050 Z" fill="url(#pitch)"/>
  <g stroke="rgba(235,255,244,0.45)" stroke-width="5" fill="none">
    <line x1="0" y1="700" x2="1400" y2="640"/>
    <line x1="0" y1="880" x2="1400" y2="820"/>
    <path d="M980 470 q-40 300 -60 580"/>
  </g>

  <!-- distant players -->
  <g fill="#040c18" opacity="0.85">
    <circle cx="880" cy="640" r="10"/><rect x="872" y="650" width="18" height="34" rx="6"/>
    <circle cx="960" cy="628" r="10"/><rect x="952" y="638" width="18" height="34" rx="6"/>
    <circle cx="1040" cy="620" r="10"/><rect x="1032" y="630" width="18" height="34" rx="6"/>
  </g>

  <!-- foreground observer silhouette with notepad -->
  <g fill="#020812">
    <circle cx="360" cy="360" r="86"/>
    <path d="M250 1050 q10 -300 110 -360 q100 60 110 360 Z"/>
    <path d="M300 700 q60 -40 120 0 l-14 40 q-46 -30 -92 0 Z" opacity="0.9"/>
  </g>
  <rect x="250" y="470" width="120" height="150" rx="10" fill="#0d1524"/>
  <rect x="266" y="486" width="88" height="118" rx="6" fill="#e9ecdf" opacity="0.85"/>
  <g stroke="#556678" stroke-width="4" fill="none" opacity="0.8">
    <line x1="280" y1="512" x2="340" y2="512"/>
    <line x1="280" y1="540" x2="340" y2="540"/>
    <line x1="280" y1="568" x2="320" y2="568"/>
  </g>

  <rect width="1400" height="1050" fill="url(#vig)"/>
</svg>
