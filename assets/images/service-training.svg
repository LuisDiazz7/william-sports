<svg width="100%" height="100%" viewBox="0 0 1400 1050" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Entrenador dirigiendo una sesión con jugadores en la cancha">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d3520"/>
      <stop offset="55%" stop-color="#14572f"/>
      <stop offset="100%" stop-color="#0a2a19"/>
    </linearGradient>
    <radialGradient id="luz" cx="70%" cy="20%" r="65%">
      <stop offset="0%" stop-color="rgba(150,255,190,0.22)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9a4d"/>
      <stop offset="100%" stop-color="#d95a12"/>
    </linearGradient>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="1050" fill="url(#g)"/>
  <rect width="1400" height="1050" fill="url(#luz)"/>
  <g opacity="0.3">
    <rect x="0" y="120" width="1400" height="130" fill="#0c2f1d"/>
    <rect x="0" y="380" width="1400" height="130" fill="#0c2f1d"/>
    <rect x="0" y="640" width="1400" height="130" fill="#0c2f1d"/>
    <rect x="0" y="900" width="1400" height="130" fill="#0c2f1d"/>
  </g>

  <!-- training cones line -->
  <g>
    <g transform="translate(430,760)">
      <ellipse cx="0" cy="40" rx="52" ry="12" fill="rgba(0,0,0,0.3)"/>
      <polygon points="0,-40 -40,40 40,40" fill="url(#cone)"/>
      <rect x="-42" y="26" width="84" height="16" rx="5" fill="#c9500f"/>
    </g>
    <g transform="translate(690,720)">
      <ellipse cx="0" cy="40" rx="52" ry="12" fill="rgba(0,0,0,0.3)"/>
      <polygon points="0,-40 -40,40 40,40" fill="url(#cone)"/>
      <rect x="-42" y="26" width="84" height="16" rx="5" fill="#c9500f"/>
    </g>
    <g transform="translate(950,690)">
      <ellipse cx="0" cy="40" rx="52" ry="12" fill="rgba(0,0,0,0.3)"/>
      <polygon points="0,-40 -40,40 40,40" fill="url(#cone)"/>
      <rect x="-42" y="26" width="84" height="16" rx="5" fill="#c9500f"/>
    </g>
  </g>

  <!-- coach figure -->
  <g fill="#04110a">
    <circle cx="250" cy="430" r="46"/>
    <path d="M186 880 q6 -220 64 -262 q58 42 64 262 Z"/>
    <rect x="300" y="470" width="16" height="150" rx="8"/>
  </g>
  <!-- players receiving instructions -->
  <g fill="#061a10" opacity="0.92">
    <circle cx="620" cy="560" r="30"/><rect x="596" y="592" width="48" height="120" rx="16"/>
    <circle cx="770" cy="580" r="28"/><rect x="748" y="610" width="44" height="112" rx="16"/>
    <circle cx="900" cy="600" r="26"/><rect x="880" y="628" width="40" height="104" rx="16"/>
  </g>

  <g stroke="#1d7a44" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <path d="M120 1050 q10 -56 30 -84"/>
    <path d="M700 1050 q-6 -66 10 -104"/>
    <path d="M1240 1050 q12 -60 34 -90"/>
  </g>

  <rect width="1400" height="1050" fill="url(#vig)"/>
</svg>
